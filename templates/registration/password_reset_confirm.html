{% extends 'base.html' %}{% block title %}New password{% endblock %}{% block content %}<h1>Choose a new password</h1>
{% if validlink %}<form method="post" style="max-width:28rem">{% csrf_token %}{{ form.as_div }}<button class="btn btn-saffron btn-lg mt-3">Change password</button></form>
{% else %}<p>This reset link is invalid or has expired. <a href="{% url 'password_reset' %}">Request a new one</a>.</p>{% endif %}{% endblock %}
