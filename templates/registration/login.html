{% extends 'base.html' %}{% block title %}Log in{% endblock %}{% block content %}<h1>Log in</h1>
<form method="post" style="max-width:28rem" novalidate>{% csrf_token %}
<input type="hidden" name="next" value="{{ next }}">
{% if form.errors %}<div class="alert alert-danger">Incorrect username or password. Both are case-sensitive.</div>{% endif %}
{% for f in form %}<div class="mb-3"><label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>
<input class="form-control form-control-lg" type="{{ f.field.widget.input_type }}" name="{{ f.html_name }}" id="{{ f.id_for_label }}"
 {% if f.html_name == 'username' %}value="{{ f.value|default:'' }}" autocomplete="username" autofocus{% else %}autocomplete="current-password"{% endif %} required></div>{% endfor %}
<button class="btn btn-saffron btn-lg">Log in</button></form>
<p class="mt-3"><a href="{% url 'password_reset' %}">Forgot your password?</a> · <a href="{% url 'register' %}">Create an account</a></p>{% endblock %}
