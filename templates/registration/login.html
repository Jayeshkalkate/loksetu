{% extends 'base.html' %}{% block content %}<h1>Log in</h1>
<form method="post" style="max-width:28rem">{% csrf_token %}{% for f in form %}<div class="mb-3"><label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>
<input class="form-control form-control-lg" type="{{ f.field.widget.input_type }}" name="{{ f.html_name }}" id="{{ f.id_for_label }}" required></div>{% endfor %}
{{ form.non_field_errors }}<button class="btn btn-saffron btn-lg">Log in</button></form>{% endblock %}
