{% extends 'base.html' %}{% block content %}<h1>My complaints</h1>
<div class="list-group">{% for c in items %}<a class="list-group-item" href="{% url 'complaint_detail' c.complaint_id %}"><b>{{ c.complaint_id }}</b> {{ c.title }} <span class="badge bg-secondary">{{ c.get_status_display }}</span></a>
{% empty %}<p>You have not filed any complaints yet.</p>{% endfor %}</div>{% endblock %}
