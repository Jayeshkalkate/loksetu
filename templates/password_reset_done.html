{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LokSetu – Reset Email Sent</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #d4e0f5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reset-card {
      max-width: 460px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.10);
      padding: 40px 36px;
      text-align: center;
    }
    .reset-card .icon {
      font-size: 3rem;
      color: #28a745;
      background: #e8f5e9;
      width: 80px;
      height: 80px;
      line-height: 80px;
      border-radius: 50%;
      display: inline-block;
      margin-bottom: 16px;
    }
    .reset-card h2 {
      font-weight: 700;
      color: #1a3c6e;
      font-size: 1.7rem;
      margin-bottom: 8px;
    }
    .reset-card p {
      color: #4a5a72;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .reset-card .back-link {
      display: inline-block;
      margin-top: 16px;
      color: #1a3c6e;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
    }
    .reset-card .back-link:hover {
      text-decoration: underline;
    }
    @media (max-width: 480px) {
      .reset-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

<div class="reset-card">
  <div class="icon"><i class="fas fa-envelope-open-text"></i></div>
  <h2>Check Your Inbox</h2>
  <p>We’ve sent you an email with instructions to reset your password.</p>
  <p style="font-size:0.9rem; color:#6c7a8a;">If you don’t receive the email within a few minutes, please check your spam folder.</p>
  <a href="{% url 'login' %}" class="back-link"><i class="fas fa-arrow-left"></i> Return to Login</a>
</div>

</body>
</html>
