{% extends 'base.html' %}{% load i18n %}{% block title %}{% trans "Edit review" %}{% endblock %}{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><h1 class="h3">{% trans "Edit your review" %}</h1>
<p class="text-muted">{% trans "Edited reviews return to moderation before they are shown publicly." %}</p>

</div></div>{% endblock %}
