{% load static %}
{% include "header.html" %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LokSetu – Upload Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <style>
    body {
      background: #f4f7fc;
    }
    .upload-wrapper {
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .upload-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      border: 1px solid #e9edf4;
    }
    .upload-card .card-header-custom {
      background: linear-gradient(135deg, #1a3c6e 0%, #2a5a9a 100%);
      color: #fff;
      padding: 18px 28px;
    }
    .upload-card .card-header-custom h3 {
      font-weight: 700;
      margin: 0;
      font-size: 1.4rem;
    }
    .upload-card .card-header-custom h3 i {
      margin-right: 10px;
    }
    .upload-card .card-body {
      padding: 28px 30px 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      font-weight: 500;
      color: #2c3e50;
      display: block;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    .form-group label i {
      margin-right: 6px;
      color: #1a3c6e;
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d0d7de;
      border-radius: 10px;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #f8fafc;
    }
    .form-control:focus {
      border-color: #1a3c6e;
      box-shadow: 0 0 0 4px rgba(26, 60, 110, 0.10);
      outline: none;
      background: #fff;
    }
    .file-input-wrapper {
      position: relative;
    }
    .file-input-wrapper input[type="file"] {
      padding: 10px;
      background: #f8fafc;
      border: 1.5px dashed #d0d7de;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .file-input-wrapper input[type="file"]:hover {
      border-color: #1a3c6e;
    }
    .btn-upload {
      padding: 12px 32px;
      background: linear-gradient(135deg, #1a3c6e 0%, #2a5a9a 100%);
      border: none;
      border-radius: 40px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-upload:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26, 60, 110, 0.3);
    }
    .btn-secondary-custom {
      padding: 12px 32px;
      border-radius: 40px;
      background: #e8f0fe;
      color: #1a3c6e;
      border: 1.5px solid #d0d7de;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-secondary-custom:hover {
      background: #d4e0f5;
      transform: translateY(-2px);
    }
    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }
    @media (max-width: 480px) {
      .upload-card .card-body {
        padding: 20px;
      }
      .action-row {
        flex-direction: column;
      }
      .btn-upload, .btn-secondary-custom {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<div class="upload-wrapper">

  <div class="upload-card">
    <div class="card-header-custom">
      <h3><i class="fas fa-cloud-upload-alt"></i> Upload Document</h3>
    </div>
    <div class="card-body">
      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
          <label for="id_title"><i class="fas fa-heading"></i> Document Title</label>
          {{ form.title }}
        </div>

        <div class="form-group">
          <label for="id_file"><i class="fas fa-paperclip"></i> Choose File</label>
          <div class="file-input-wrapper">
            {{ form.file }}
          </div>
          <div style="font-size:0.85rem; color:#6c7a8a; margin-top:4px;">
            <i class="fas fa-info-circle"></i> Supported formats: PDF, DOC, DOCX, JPG, PNG (max 5MB)
          </div>
        </div>

        <div class="action-row">
          <button type="submit" class="btn-upload"><i class="fas fa-upload"></i> Upload Document</button>
          <a href="{% url 'document_list' %}" class="btn-secondary-custom"><i class="fas fa-list"></i> View All Documents</a>
        </div>
      </form>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
{% include "footer.html" %}
