{% extends 'base.html' %}{% block content %}<h1>{{ title }}</h1>
{% for o in object_list %}<div class="tile mb-3"><h2 class="h5">{{ o }}</h2><p class="mb-1">{{ o.blurb|linebreaksbr }}</p>
{% if o.number %}<a class="btn btn-danger" href="tel:{{ o.number }}">Call {{ o.number }}</a>{% endif %}
{% if o.official_source %}<a href="{{ o.official_source }}" rel="noopener">Official source</a>{% endif %}</div>
{% empty %}<p>Nothing here yet.</p>{% endfor %}{% endblock %}
