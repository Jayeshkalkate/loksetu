{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LokSetu – Set New Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #d4e0f5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reset-card {
      max-width: 460px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.10);
      padding: 40px 36px;
      text-align: center;
    }
    .reset-card .icon {
      font-size: 2.8rem;
      color: #1a3c6e;
      background: #e8f0fe;
      width: 72px;
      height: 72px;
      line-height: 72px;
      border-radius: 50%;
      display: inline-block;
      margin-bottom: 16px;
    }
    .reset-card h2 {
      font-weight: 700;
      color: #1a3c6e;
      font-size: 1.7rem;
      margin-bottom: 8px;
    }
    .reset-card p {
      color: #4a5a72;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .reset-card form {
      text-align: left;
    }
    .reset-card .form-group {
      margin-bottom: 18px;
    }
    .reset-card label {
      display: block;
      font-weight: 500;
      color: #2c3e50;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .reset-card input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #d0d7de;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #f8fafc;
    }
    .reset-card input[type="password"]:focus {
      border-color: #1a3c6e;
      box-shadow: 0 0 0 4px rgba(26,60,110,0.10);
      outline: none;
      background: #fff;
    }
    .reset-card .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1a3c6e 0%, #2a5a9a 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .reset-card .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26,60,110,0.3);
    }
    .reset-card .errorlist {
      color: #dc3545;
      font-size: 0.85rem;
      list-style: none;
      padding: 0;
      margin: -8px 0 12px;
    }
    @media (max-width: 480px) {
      .reset-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

<div class="reset-card">
  <div class="icon"><i class="fas fa-key"></i></div>
  <h2>Set New Password</h2>
  <p>Enter your new password below.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="form-group">
      <label for="id_new_password1">New Password</label>
      {{ form.new_password1 }}
      {{ form.new_password1.errors }}
    </div>
    <div class="form-group">
      <label for="id_new_password2">Confirm Password</label>
      {{ form.new_password2 }}
      {{ form.new_password2.errors }}
    </div>
    <button type="submit" class="btn-submit">
      <i class="fas fa-save"></i> Reset Password
    </button>
  </form>
</div>

</body>
</html>
