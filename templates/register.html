{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LokSetu – Citizen Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="{% static 'css/register.css' %}" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #d4e0f5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }
    .register-wrapper {
      max-width: 560px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
      overflow: hidden;
    }
    .register-header {
      background: linear-gradient(135deg, #1a3c6e 0%, #2a5a9a 100%);
      padding: 28px 32px 22px;
      text-align: center;
    }
    .register-header .logo-icon {
      font-size: 2.8rem;
      color: #fff;
      background: rgba(255,255,255,0.15);
      width: 72px;
      height: 72px;
      line-height: 72px;
      border-radius: 50%;
      display: inline-block;
      margin-bottom: 8px;
    }
    .register-header h2 {
      color: #fff;
      font-weight: 700;
      font-size: 1.8rem;
      margin: 0;
      letter-spacing: -0.5px;
    }
    .register-header p {
      color: rgba(255,255,255,0.8);
      font-size: 0.95rem;
      margin: 4px 0 0;
    }
    .register-body {
      padding: 28px 32px 32px;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-weight: 500;
      color: #2c3e50;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }
    .form-group label .required {
      color: #dc3545;
      margin-left: 2px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d0d7de;
      border-radius: 10px;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #f8fafc;
      font-family: inherit;
      color: #1a2a3a;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #1a3c6e;
      box-shadow: 0 0 0 4px rgba(26,60,110,0.10);
      outline: none;
      background: #fff;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }
    .form-group input[readonly] {
      background: #f1f3f5;
      cursor: not-allowed;
    }

    .otp-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .otp-group input {
      flex: 1;
      min-width: 140px;
    }
    .otp-group .btn-otp {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-otp.primary {
      background: #1a3c6e;
      color: #fff;
    }
    .btn-otp.primary:hover {
      background: #14315a;
      transform: translateY(-1px);
    }
    .btn-otp.primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-otp.secondary {
      background: #e8f0fe;
      color: #1a3c6e;
    }
    .btn-otp.secondary:hover {
      background: #d4e0f5;
    }
    .btn-otp.success {
      background: #28a745;
      color: #fff;
    }
    .btn-otp.success:hover {
      background: #218838;
    }
    .btn-otp.danger {
      background: #dc3545;
      color: #fff;
    }

    .status-msg {
      margin-top: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 4px 0;
    }
    .status-msg.success { color: #28a745; }
    .status-msg.error { color: #dc3545; }
    .status-msg.info { color: #1a3c6e; }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0 16px;
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #1a3c6e;
      cursor: pointer;
    }
    .checkbox-group label {
      font-size: 0.9rem;
      color: #2c3e50;
      cursor: pointer;
    }

    .btn-register {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1a3c6e 0%, #2a5a9a 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26,60,110,0.3);
    }
    .btn-register i {
      font-size: 1.1rem;
    }

    .form-error {
      color: #dc3545;
      font-size: 0.85rem;
      font-weight: 500;
      margin-top: 8px;
      padding: 8px 12px;
      background: #fde8e8;
      border-radius: 8px;
      display: none;
    }
    .form-error.show {
      display: block;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #e9edf4;
      font-size: 0.95rem;
      color: #4a5a72;
    }
    .login-link a {
      color: #1a3c6e;
      font-weight: 600;
      text-decoration: none;
    }
    .login-link a:hover {
      text-decoration: underline;
    }

    .messages {
      margin-bottom: 16px;
    }
    .messages .alert {
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .messages .alert-error {
      background: #fde8e8;
      color: #7a1a1a;
      border-left: 4px solid #dc3545;
    }
    .messages .alert-success {
      background: #e8f5e9;
      color: #1e5a3a;
      border-left: 4px solid #28a745;
    }

    @media (max-width: 480px) {
      .register-body { padding: 20px; }
      .register-header { padding: 20px; }
      .register-header h2 { font-size: 1.4rem; }
      .otp-group { flex-direction: column; }
      .otp-group input { min-width: auto; }
      .otp-group .btn-otp { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

<div class="register-wrapper">

  <!-- Header -->
  <div class="register-header">
    <div class="logo-icon"><i class="fas fa-user-plus"></i></div>
    <h2>Citizen Registration</h2>
    <p>Create your LokSetu account to access public services</p>
  </div>

  <!-- Body -->
  <div class="register-body">

    <!-- Django Messages -->
    {% if messages %}
    <div class="messages">
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post" id="registerForm" novalidate>
      {% csrf_token %}

      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">Full Name <span class="required">*</span></label>
        <input type="text" id="fullName" name="full_name" placeholder="Enter your full name" required />
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required />
      </div>

      <!-- Gender -->
      <div class="form-group">
        <label for="gender">Gender <span class="required">*</span></label>
        <select id="gender" name="gender" required>
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <!-- Aadhaar -->
      <div class="form-group">
        <label for="aadhaar">Aadhaar Number <span style="color:#6c7a8a; font-weight:400;">(Optional)</span></label>
        <input type="text" id="aadhaar" name="aadhaar" pattern="[0-9]{12}" maxlength="12" placeholder="12-digit Aadhaar" />
      </div>

      <!-- Phone + OTP -->
      <div class="form-group">
        <label for="phone">Phone Number <span class="required">*</span></label>
        <div class="otp-group">
          <input type="tel" id="phone" name="phone_number" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile" required />
          <button type="button" class="btn-otp primary" id="sendOtpBtn"><i class="fas fa-paper-plane"></i> Send OTP</button>
          <button type="button" class="btn-otp secondary" id="resendOtpBtn" disabled><i class="fas fa-redo"></i> Resend</button>
        </div>
      </div>

      <!-- OTP -->
      <div class="form-group">
        <label for="otp">Enter OTP</label>
        <div class="otp-group">
          <input type="text" id="otp" name="otp" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit OTP" />
          <button type="button" class="btn-otp success" id="verifyOtpBtn"><i class="fas fa-check"></i> Verify OTP</button>
        </div>
        <div id="otpStatus" class="status-msg"></div>
      </div>

      <!-- Pincode -->
      <div class="form-group">
        <label for="pincode">Pincode <span class="required">*</span></label>
        <input type="text" id="pincode" name="pincode" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit pincode" required />
        <div id="pincodeStatus" class="status-msg"></div>
      </div>

      <!-- District (auto-filled) -->
      <div class="form-group">
        <label for="village">District <span class="required">*</span></label>
        <input type="text" id="village" name="village" placeholder="Auto-filled from pincode" readonly required />
      </div>

      <!-- Address -->
      <div class="form-group">
        <label for="address">Address <span class="required">*</span></label>
        <textarea id="address" name="address" rows="2" placeholder="Street, landmark, etc." required></textarea>
      </div>

      <!-- Ward -->
      <div class="form-group">
        <label for="ward">Ward Number <span style="color:#6c7a8a; font-weight:400;">(Optional)</span></label>
        <input type="number" id="ward" name="ward" placeholder="e.g. 5" />
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" name="password" pattern=".{8,}" placeholder="Minimum 8 characters" required />
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
        <input type="password" id="confirmPassword" name="confirm_password" placeholder="Re-enter password" required />
      </div>

      <!-- Show Password -->
      <div class="checkbox-group">
        <input type="checkbox" id="showPassword" />
        <label for="showPassword"><i class="fas fa-eye"></i> Show Password</label>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-register"><i class="fas fa-user-check"></i> Create Account</button>
      <div id="formError" class="form-error"></div>
    </form>

    <div class="login-link">
      Already have an account? <a href="{% url 'login' %}">Login here</a>
    </div>
  </div>
</div>

<script>
  (function() {
    const form = document.getElementById('registerForm');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const showPassword = document.getElementById('showPassword');
    const aadhaar = document.getElementById('aadhaar');
    const pincode = document.getElementById('pincode');
    const village = document.getElementById('village');
    const statusDiv = document.getElementById('pincodeStatus');
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const resendOtpBtn = document.getElementById('resendOtpBtn');
    const verifyOtpBtn = document.getElementById('verifyOtpBtn');
    const otp = document.getElementById('otp');
    const otpStatus = document.getElementById('otpStatus');
    const errorDiv = document.getElementById('formError');

    // Show password toggle
    showPassword.addEventListener('change', function() {
      const type = this.checked ? 'text' : 'password';
      password.type = type;
      confirmPassword.type = type;
    });

    // Pincode lookup
    let timer;
    pincode.addEventListener('input', function() {
      clearTimeout(timer);
      const pin = this.value.trim();
      if (!/^\d{6}$/.test(pin)) {
        village.value = '';
        statusDiv.textContent = '';
        statusDiv.className = 'status-msg';
        return;
      }
      statusDiv.textContent = '⏳ Fetching location...';
      statusDiv.className = 'status-msg info';
      timer = setTimeout(() => {
        fetch(`https://api.postalpincode.in/pincode/${pin}`)
          .then(res => res.json())
          .then(data => {
            if (data[0].Status === 'Success') {
              const district = data[0].PostOffice[0].District;
              village.value = district;
              statusDiv.textContent = `✅ Located: ${district}`;
              statusDiv.className = 'status-msg success';
            } else {
              village.value = '';
              statusDiv.textContent = '❌ Invalid pincode';
              statusDiv.className = 'status-msg error';
            }
          })
          .catch(() => {
            statusDiv.textContent = '❌ Error fetching location';
            statusDiv.className = 'status-msg error';
          });
      }, 500);
    });

    let countdown = 30;
    let countdownInterval;

    function startResendTimer() {
      resendOtpBtn.disabled = true;
      countdown = 30;
      clearInterval(countdownInterval);
      countdownInterval = setInterval(function() {
        countdown--;
        resendOtpBtn.textContent = `Resend (${countdown}s)`;
        if (countdown <= 0) {
          clearInterval(countdownInterval);
          resendOtpBtn.disabled = false;
          resendOtpBtn.innerHTML = '<i class="fas fa-redo"></i> Resend';
        }
      }, 1000);
    }

    // Send OTP
    sendOtpBtn.addEventListener('click', function() {
      const phone = document.getElementById('phone').value;
      if (!/^\d{10}$/.test(phone)) {
        otpStatus.textContent = '❌ Enter a valid 10-digit phone number';
        otpStatus.className = 'status-msg error';
        return;
      }

      sendOtpBtn.disabled = true;
      sendOtpBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

      fetch('/accounts/send-otp/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
        },
        body: `phone=${phone}`,
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          otpStatus.textContent = '✅ OTP sent successfully! Check your phone.';
          otpStatus.className = 'status-msg success';
          otp.focus();
          startResendTimer();
        } else {
          otpStatus.textContent = '❌ ' + data.message;
          otpStatus.className = 'status-msg error';
          sendOtpBtn.disabled = false;
          sendOtpBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
        }
      })
      .catch(() => {
        otpStatus.textContent = '❌ Network error. Please try again.';
        otpStatus.className = 'status-msg error';
        sendOtpBtn.disabled = false;
        sendOtpBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
      });
    });

    // Resend OTP
    resendOtpBtn.addEventListener('click', function() {
      sendOtpBtn.click();
    });

    // Verify OTP
    verifyOtpBtn.addEventListener('click', function() {
      const phone = document.getElementById('phone').value;
      const otpValue = otp.value.trim();

      if (!/^\d{6}$/.test(otpValue)) {
        otpStatus.textContent = '❌ Enter a valid 6-digit OTP';
        otpStatus.className = 'status-msg error';
        return;
      }

      verifyOtpBtn.disabled = true;
      verifyOtpBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

      fetch('/accounts/verify-otp/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
        },
        body: `phone=${phone}&otp=${otpValue}`,
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          otpStatus.textContent = '✅ OTP Verified Successfully!';
          otpStatus.className = 'status-msg success';
          otp.disabled = true;
          verifyOtpBtn.textContent = '✅ Verified';
          verifyOtpBtn.className = 'btn-otp secondary';
          verifyOtpBtn.disabled = true;
        } else {
          otpStatus.textContent = '❌ ' + data.message;
          otpStatus.className = 'status-msg error';
          verifyOtpBtn.disabled = false;
          verifyOtpBtn.innerHTML = '<i class="fas fa-check"></i> Verify OTP';
        }
      })
      .catch(() => {
        otpStatus.textContent = '❌ Network error. Please try again.';
        otpStatus.className = 'status-msg error';
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.innerHTML = '<i class="fas fa-check"></i> Verify OTP';
      });
    });

    // Form validation
    form.addEventListener('submit', function(e) {
      errorDiv.textContent = '';
      errorDiv.className = 'form-error';

      // Validate OTP
      if (!/^\d{6}$/.test(otp.value)) {
        e.preventDefault();
        errorDiv.textContent = 'Please enter a valid 6-digit OTP and verify it.';
        errorDiv.className = 'form-error show';
        return;
      }

      // Password match
      if (password.value !== confirmPassword.value) {
        e.preventDefault();
        errorDiv.textContent = 'Passwords do not match.';
        errorDiv.className = 'form-error show';
        return;
      }

      // Password length
      if (password.value.length < 8) {
        e.preventDefault();
        errorDiv.textContent = 'Password must be at least 8 characters.';
        errorDiv.className = 'form-error show';
        return;
      }

      // Aadhaar format if provided
      if (aadhaar.value && !/^\d{12}$/.test(aadhaar.value)) {
        e.preventDefault();
        errorDiv.textContent = 'Invalid Aadhaar number (must be 12 digits).';
        errorDiv.className = 'form-error show';
        return;
      }
    });
  })();
</script>

</body>
</html>
