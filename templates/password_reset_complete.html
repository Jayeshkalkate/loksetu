{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LokSetu – Password Reset Complete</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #d4e0f5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reset-card {
      max-width: 460px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.10);
      padding: 40px 36px;
      text-align: center;
    }
    .reset-card .icon {
      font-size: 3.5rem;
      color: #28a745;
      background: #e8f5e9;
      width: 90px;
      height: 90px;
      line-height: 90px;
      border-radius: 50%;
      display: inline-block;
      margin-bottom: 16px;
    }
    .reset-card h2 {
      font-weight: 700;
      color: #1a3c6e;
      font-size: 1.7rem;
      margin-bottom: 8px;
    }
    .reset-card p {
      color: #4a5a72;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .reset-card .btn-login {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 32px;
      background: linear-gradient(135deg, #1a3c6e 0%, #2a5a9a 100%);
      color: #fff;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .reset-card .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26,60,110,0.3);
    }
    .reset-card .btn-login i {
      margin-right: 8px;
    }
    @media (max-width: 480px) {
      .reset-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

<div class="reset-card">
  <div class="icon"><i class="fas fa-check-circle"></i></div>
  <h2>Password Reset Complete</h2>
  <p>Your password has been successfully set. You can now log in with your new credentials.</p>
  <a href="{% url 'login' %}" class="btn-login"><i class="fas fa-sign-in-alt"></i> Log In</a>
</div>

</body>
</html>
