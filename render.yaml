services:
  - type: web
    name: loksetu
    env: python
    plan: starter  # or 'free' for hobby projects
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      gunicorn loksetu.wsgi:application --workers=4 --threads=2 --timeout=120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: loksetu.settings
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: loksetu-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: loksetu-redis
          type: redis
          property: connectionString
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: loksetu.onrender.com,localhost,127.0.0.1
    healthCheckPath: /admin/
    autoDeploy: true

  # =============================================
  # Redis for Celery (if using background tasks)
  # =============================================
  - type: redis
    name: loksetu-redis
    plan: starter  # or 'free'
    maxmemoryPolicy: noeviction
    ipAllowList: []  # only allow internal connections

  # =============================================
  # PostgreSQL Database (managed by Render)
  # =============================================
  - type: postgresql
    name: loksetu-db
    plan: starter
    database: loksetu
    user: loksetu